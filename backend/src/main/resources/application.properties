# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
# Using MySQL for development (connected to Workbench database)
# Update password based on your MySQL root password

spring.datasource.url=jdbc:mysql://localhost:3307/happytails_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# spring.datasource.password=root
# MySQL connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA (Java Persistence API) / HIBERNATE CONFIGURATION
# ===================================================================
# This tells Hibernate (our JPA provider) to use the MySQL dialect.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# This is the most important part!
# "spring.jpa.hibernate.ddl-auto=update" tells Spring Boot to:
# 1. Read all your @Entity classes (Pet, Adopter, Shelter, etc.).
# 2. Automatically create all the tables and columns in your database.
# This saves you from having to write any "CREATE TABLE" SQL code.
spring.jpa.hibernate.ddl-auto=update

# (Optional) This is great for debugging. It prints every single
# SQL query that Spring Boot runs to your console.
spring.jpa.show-sql=true

# ===================================================================
# DATA INITIALIZATION
# ===================================================================
# Disabled sample data loading - use database setup scripts manually
# spring.jpa.defer-datasource-initialization=true
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:sample-data.sql

# ===================================================================
# FILE UPLOAD CONFIGURATION
# ===================================================================
# Enable multipart file uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1KB

# ===================================================================
# STATIC RESOURCES CONFIGURATION
# ===================================================================
# Serve uploaded images from /uploads/** path
spring.web.resources.static-locations=file:uploads/,classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

